# =====================================================================
#  Fichier de configuration d'exemple pour Init-DefenseReseau.sh
#  Usage : sudo ./Init-DefenseReseau.sh --unattended --config config.sample.conf
#
#  Ce fichier est "source" par bash : syntaxe VARIABLE="valeur".
#  En mode --unattended, les questions recoivent la valeur par defaut,
#  et ces variables CFG_* remplacent les valeurs par defaut.
#  Les modules absents de CFG_MODULES sont ignores.
#  NE COMMITEZ JAMAIS un fichier de configuration contenant des secrets.
# =====================================================================

# --- Modules a executer, dans l'ordre (espace comme separateur) ---
# Valeurs possibles : concepts parefeu ids proxy revproxy bastion privileges audit rapport
# (zerotrust est interactif uniquement : questionnaire)
CFG_MODULES="parefeu ids proxy bastion privileges audit rapport"

# --- Rapport ---
CFG_REPORT_DIR="/root/Rapports-DefenseReseau"

# --- Module 3 : pare-feu -------------------------------------------------
# En unattended, le premier choix des menus est retenu :
# moteur = nftables, role = hote simple (filtrage entrant).
CFG_FW_SSH_PORT="22"
CFG_FW_EXTRA_TCP=""            # ex: "80 443"
CFG_FW_EXTRA_UDP=""
CFG_FW_APPLY="n"               # "o" : applique les regles (rollback 60 s sans
                               # confirmation manuelle -> laisser "n" en unattended
                               # sauf acces console garanti !)
CFG_FW_OPNSENSE_GUIDE="o"      # genere le guide OPNsense
# Mode routeur (execution interactive uniquement pour le choix du role) :
CFG_FW_WAN_IF=""
CFG_FW_LAN_IF=""
CFG_FW_DMZ_IF=""
CFG_FW_FORWARDS=""             # ex: "443:192.168.20.10:443 80:192.168.20.10:80"

# --- Module 4 : IDS/IPS (Suricata retenu en unattended) ------------------
CFG_IDS_IFACE=""               # vide : interface de la route par defaut
CFG_IDS_HOME_NET=""            # ex: "[192.168.10.0/24,192.168.20.0/24]"
CFG_IDS_LOCALRULES="o"         # installe les regles locales pedagogiques
CFG_IDS_THRESHOLD="o"          # installe les exemples de tuning
CFG_IDS_ETOPEN="o"             # telecharge les regles ET Open (Internet requis)
CFG_IDS_IPS="n"                # "o" : mode IPS nfqueue (reserve aux experts)

# --- Module 5 : proxy Squid ----------------------------------------------
CFG_SQUID="o"
CFG_SQUID_LAN="192.168.10.0/24"
CFG_SQUID_PORT="3128"

# --- Module 6 : reverse proxy (Nginx retenu en unattended) ----------------
CFG_RP_NAME="app.exemple.local"
CFG_RP_BACKEND="http://192.168.20.10:8080"
CFG_RP_BACKEND_HA="192.168.20.10:8080"
# Source du certificat TLS : "existing" (PKI interne / deja emis, RECOMMANDE),
# "letsencrypt" (certbot, Nginx uniquement : domaine public + port 80 joignables)
# ou "selfsigned" (auto-signe de lab).
CFG_RP_CERT_MODE="selfsigned"
CFG_RP_CERT_CRT=""             # si "existing" : chemin du certificat (fullchain)
CFG_RP_CERT_KEY=""             # si "existing" : chemin de la cle privee
CFG_RP_LE_EMAIL=""             # si "letsencrypt" : e-mail d'enregistrement (avis d'expiration)

# --- Module 7 : bastion SSH ----------------------------------------------
CFG_BASTION="o"
CFG_BASTION_GROUP="adminssh"
CFG_BASTION_USER=""            # vide : l'utilisateur qui a lance sudo
CFG_BASTION_PORT="22"
CFG_BASTION_NOPASS="o"         # ne s'applique QUE si une cle publique existe deja
CFG_BASTION_FAIL2BAN="o"

# --- Module 8 : moindre privilege -----------------------------------------
CFG_PRIV_SUDOERS="o"
CFG_PRIV_GROUP="exploitants"
CFG_PRIV_UMASK="o"
CFG_PRIV_PWQUALITY="o"

# --- Module 9 : audit d'hygiene --------------------------------------------
# "o" : en unattended, TOUTES les corrections proposees par l'audit sont
# appliquees automatiquement (MAJ, sysctl, permissions, rsyslog/auditd...).
# "n" : audit seul, aucune correction (les corrections restent proposees
# une par une en mode interactif).
CFG_AUDIT_FIX="n"
